version: 1
formatters:
  default:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
handlers:
  file:
    class: logging.FileHandler
    formatter: default
    filename: /var/log/uvicorn.log
    mode: a
loggers:
  uvicorn:
    handlers: [file]
    level: INFO
    propagate: no
  uvicorn.error:
    handlers: [file]
    level: INFO
    propagate: no
  uvicorn.access:
    handlers: [file]
    level: INFO
    propagate: no
root:
  handlers: [file]
  level: INFO