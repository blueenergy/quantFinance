version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(levelname)s %(asctime)s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
handlers:
  default:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
loggers:
  uvicorn:
    handlers: [default]
    level: INFO
  uvicorn.error:
    handlers: [default]
    level: INFO
  uvicorn.access:
    handlers: [default]
    level: INFO
root:
  handlers: [default]
  level: INFO