# WebSocket 升级映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP server（监听 80 端口）
server {
        listen 80;
        server_name 180.184.30.225;

    root /home/shuyolin/quantFinance-dashboard/dist; # Path to built files
        index index.html;

         # Fix Vue router history mode
        location / {
          try_files $uri $uri/ /index.html;
                   }

    # WebSocket 直连路由（Worker 实时日志）
    # 代理到远程 Worker 机器
    location ~ ^/ws/(\d+)$ {
        # 动态转发到远程 Worker 的 WebSocket 端口
        proxy_pass http://115.190.254.11:$1;
        
        # WebSocket 必需配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 长连接超时（7天）
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # 其他头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

            # FastAPI 接口代理（quantFinance 3001端口）
            # 包括 /api/strategy/workers 的代理
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_redirect off;
    }
    location /docs {
        proxy_pass http://127.0.0.1:3001/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
         # Optional: Add cache headers for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        }
}
# HTTPS server（监听 443 端口）
server {
    listen 443 ssl;
    server_name 180.184.30.225;

    # SSL 证书和私钥路径
    ssl_certificate /etc/nginx/cert/wukongquant.top.pem;
    ssl_certificate_key /etc/nginx/cert/wukongquant.top.key;

    # 推荐的 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # 前端静态文件路径
    root /home/shuyolin/quantFinance-dashboard/dist;
    index index.html;

    # Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket 直连路由（Worker 实时日志）- 支持 WSS
    # 代理到远程 Worker 机器
    location ~ ^/ws/(\d+)$ {
        # 动态转发到远程 Worker 的 WebSocket 端口
        proxy_pass http://115.190.254.11:$1;
        
        # WebSocket 必需配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 长连接超时（7天）
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # 其他头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # quantFinance API（3001端口）
    # 包括 /api/strategy/workers 的代理
    location /api/ {
        # 反向代理到后端服务，例如 FastAPI
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    
    location /docs {
        proxy_pass http://127.0.0.1:3001/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
        # Optional: Add cache headers for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        }
}