stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - requirements-ci.txt
  paths:
    - .cache/pip
    - dashboard/node_modules/
    - dashboard/.vite

frontend-tests:
  stage: test
  image: node:20
  cache:
    paths:
      - dashboard/node_modules/
      - dashboard/.vite
  script:
    - cd dashboard
    - npm ci
    - npm test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dashboard/node_modules/

backend-unit-tests:
  stage: test
  image: python:3.11
  cache:
    paths:
      - .cache/pip
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements-ci.txt
  script:
    - source .venv/bin/activate && pytest -q -m unit --junitxml=pytest-unit-report.xml || true
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: pytest-unit-report.xml

backend-integration-tests:
  stage: test
  image: python:3.11
  cache:
    paths:
      - .cache/pip
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements-ci.txt
  script:
    - source .venv/bin/activate && pytest -q -m integration --junitxml=pytest-integration-report.xml || true
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: pytest-integration-report.xml
