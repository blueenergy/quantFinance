name: CI

on:
  push:
    branches: [ main, master, develop, fix_* ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # required for ghcr.io push

env:
  PIP_CACHE_DIR: ./.cache/pip
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DEFAULT_TIMEOUT: '120'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          pip install pytest
          pytest -q tests/unit -m unit --junitxml=pytest-unit-report.xml
      - name: Run integration tests (skipped)
        run: |
          echo "Skipping integration tests in GitHub Actions."

  deploy:
    name: Deploy to VolcEngine (docker pull from ACR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test-build, docker]
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VOLC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.VOLC_HOST }} >> ~/.ssh/known_hosts

      - name: Pull image and deploy
        timeout-minutes: 15
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            ${{ secrets.VOLC_USER }}@${{ secrets.VOLC_HOST }} \
            "ALIYUN_USER='${{ secrets.ALIYUN_USER }}' ALIYUN_TOKEN='${{ secrets.ALIYUN_TOKEN }}' bash -s" <<'EOF'
          set -euo pipefail

          IMAGE="crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-api:latest"

          log_step() {
            echo "[$(date '+%Y-%m-%d %H:%M:%S %z')] $*"
          }

          log_step "Logging in to Aliyun registry"
          timeout 60 docker login crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com \
            -u "$ALIYUN_USER" \
            -p "$ALIYUN_TOKEN"

          log_step "Pulling quant-api image"
          timeout 300 docker pull "$IMAGE"

          log_step "Preparing shared directories"
          mkdir -p /home/deployuser/quantFinance/logs /home/deployuser/shared/portfolio-research

          log_step "Stopping existing containers"
          timeout 30 docker stop -t 20 quant-mcp-actions 2>/dev/null || true
          timeout 30 docker rm quant-mcp-actions 2>/dev/null || true
          timeout 30 docker stop -t 20 quant-mcp-read 2>/dev/null || true
          timeout 30 docker rm quant-mcp-read 2>/dev/null || true
          timeout 30 docker stop -t 20 quant-mcp 2>/dev/null || true
          timeout 30 docker rm quant-mcp 2>/dev/null || true
          timeout 30 docker stop -t 20 quant-scheduler 2>/dev/null || true
          timeout 30 docker rm quant-scheduler 2>/dev/null || true
          timeout 30 docker stop -t 20 quant-api 2>/dev/null || true
          timeout 30 docker rm quant-api 2>/dev/null || true

          log_step "Starting quant-api"
          timeout 60 docker run -d \
            --name quant-api \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            -p 3001:3001 \
            -e TZ=Asia/Shanghai \
            -e ENABLE_EMBEDDED_SCHEDULER=false \
            -e ENABLE_MCP_SERVER=false \
            -e API_WORKERS=2 \
            -e PORTFOLIO_RESEARCH_REPORT_DIR=/app/reports/portfolio-research \
            --log-driver json-file \
            --log-opt max-size=50m \
            --log-opt max-file=3 \
            -v /home/deployuser/quantFinance/.env:/app/.env:ro \
            -v /home/deployuser/quantFinance/logs:/app/logs \
            -v /home/deployuser/shared/portfolio-research:/app/reports/portfolio-research \
            "$IMAGE"

          log_step "Starting quant-mcp-read"
          timeout 60 docker run -d \
            --name quant-mcp-read \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            -p 3002:3002 \
            -e TZ=Asia/Shanghai \
            -e ENABLE_EMBEDDED_SCHEDULER=false \
            -e ENABLE_MCP_SERVER=true \
            -e MCP_SERVER_MODE=read \
            --health-cmd "curl -f http://localhost:3002/health || exit 1" \
            --health-interval 30s \
            --health-timeout 10s \
            --health-retries 3 \
            --log-driver json-file \
            --log-opt max-size=50m \
            --log-opt max-file=3 \
            -v /home/deployuser/quantFinance/.env:/app/.env:ro \
            -v /home/deployuser/quantFinance/logs:/app/logs \
            "$IMAGE" \
            uvicorn main:app --host 0.0.0.0 --port 3002 --workers 1 --log-level info

          log_step "Starting quant-mcp-actions"
          timeout 60 docker run -d \
            --name quant-mcp-actions \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            -p 3003:3003 \
            -e TZ=Asia/Shanghai \
            -e ENABLE_EMBEDDED_SCHEDULER=false \
            -e ENABLE_MCP_SERVER=true \
            -e MCP_SERVER_MODE=actions \
            --health-cmd "curl -f http://localhost:3003/health || exit 1" \
            --health-interval 30s \
            --health-timeout 10s \
            --health-retries 3 \
            --log-driver json-file \
            --log-opt max-size=50m \
            --log-opt max-file=3 \
            -v /home/deployuser/quantFinance/.env:/app/.env:ro \
            -v /home/deployuser/quantFinance/logs:/app/logs \
            "$IMAGE" \
            uvicorn main:app --host 0.0.0.0 --port 3003 --workers 1 --log-level info

          log_step "Starting quant-scheduler"
          timeout 60 docker run -d \
            --name quant-scheduler \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            -e TZ=Asia/Shanghai \
            --health-cmd "python tools/check_scheduler_health.py" \
            --health-interval 30s \
            --health-timeout 10s \
            --health-retries 3 \
            --log-driver json-file \
            --log-opt max-size=50m \
            --log-opt max-file=3 \
            -v /home/deployuser/quantFinance/.env:/app/.env:ro \
            -v /home/deployuser/quantFinance/logs:/app/logs \
            "$IMAGE" \
            python scheduler_runner.py

          log_step "Listing deployed containers"
          docker ps --filter "name=quant-api" --filter "name=quant-mcp-read" --filter "name=quant-mcp-actions" --filter "name=quant-scheduler"

          log_step "Pruning old images"
          timeout 120 docker image prune -f || true

          log_step "Deploy finished"
          EOF

  docker:
    name: Build & Push Docker image (ghcr.io + ACR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/blueenergy/quant-api
            crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
