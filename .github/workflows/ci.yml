name: CI

on:
  push:
    branches: [ main, master, develop, fix_* ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # required for ghcr.io push

env:
  PIP_CACHE_DIR: ./.cache/pip
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DEFAULT_TIMEOUT: '120'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ./data-access-lib
      - name: Run unit tests
        run: |
          pip install pytest
          pytest -q tests/unit -m unit --junitxml=pytest-unit-report.xml
      - name: Run integration tests (skipped)
        run: |
          echo "Skipping integration tests in GitHub Actions."

  release:
    name: Bump image tag in quant-infrastructure & trigger deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test-build, docker]
    steps:
      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout quant-infrastructure
        uses: actions/checkout@v6
        with:
          repository: blueenergy/quant-infrastructure
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Bump versions.env (rebase-retry on concurrent pushes)
        working-directory: infra
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KEY: QUANT_API_IMAGE_TAG
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            sed -i "s|^${KEY}=.*|${KEY}=${TAG}|" apps/versions.env
            if git diff --quiet apps/versions.env; then
              echo "versions.env already at ${TAG}; nothing to commit."
              exit 0
            fi
            git add apps/versions.env
            git commit -m "deploy(quant-api): ${TAG}"
            if git push origin main; then
              echo "Pushed tag bump (${TAG})."
              exit 0
            fi
            echo "Push raced (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push tag bump after retries." >&2
          exit 1

      - name: Trigger centralized deploy
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # MCP containers are defined in quant-infrastructure behind the "mcp"
          # profile and are intentionally not deployed by the default CI path.
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${INFRA_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/blueenergy/quant-infrastructure/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"services\":\"quant-api quant-scheduler\",\"tag\":\"${TAG}\"}}"

  docker:
    name: Build & Push Docker image (ghcr.io + ACR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/blueenergy/quant-api
            crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
