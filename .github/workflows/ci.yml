name: CI

on:
  push:
    branches: [ main, master, develop, fix_* ]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # required for ghcr.io push

# Cancel superseded PR runs only. Main runs are serialized so a stale release
# cannot overwrite a newer versions.env pointer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_CACHE_DIR: ./.cache/pip
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DEFAULT_TIMEOUT: '120'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ./data-access-lib
      - name: Run unit tests
        run: |
          pip install pytest
          pytest -q tests/unit -m unit --junitxml=pytest-unit-report.xml
      - name: Run integration tests (skipped)
        run: |
          echo "Skipping integration tests in GitHub Actions."

  release:
    name: Bump image tag in quant-infrastructure & trigger deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Checkout, wait for the relay, bump, one dispatch POST. The wait has its
    # own 90-minute ceiling (the ghcr->ACR relay sweeps on a timer, and a slow
    # day runs to the relay's 60-minute pull timeout plus a resume retry), so
    # the job ceiling sits above it. A healthy run is about a minute.
    timeout-minutes: 120
    needs: [test-build, docker]
    steps:
      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout app repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout quant-infrastructure
        uses: actions/checkout@v6
        with:
          repository: blueenergy/quant-infrastructure
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Wait for the tag to reach ACR
        # The docker job publishes the sha- tag to ACR directly, with the host
        # relay (host/mirror_to_acr.sh) as the fallback for a failed or missing
        # push, and the deploy targets pull from ACR -- so the bump below must
        # not happen until the tag is actually readable there. Failing here is
        # deliberate: a publish that has stopped working has to surface as a
        # red run and a DingTalk alert, not as a deploy that quietly cannot
        # pull its image.
        env:
          ACR_REGISTRY: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com
          ACR_REPO: wukongquant/quant-api
          TAG: ${{ steps.tag.outputs.tag }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_TOKEN: ${{ secrets.ALIYUN_TOKEN }}
        run: bash infra/scripts/wait-for-acr-tag.sh

      - name: Bump versions.env with release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KEY: QUANT_API_IMAGE_TAG
          DEPLOY_LABEL: quant-api
          SOURCE_REPO: ${{ github.repository }}
          NEW_SHA: ${{ github.sha }}
          APP_REPO_DIR: ${{ github.workspace }}
          INFRA_DIR: ${{ github.workspace }}/infra
          SERVICES: quant-api, quant-scheduler, quant-mcp-read, quant-mcp-actions
        run: bash infra/scripts/bump-versions-env.sh

      - name: Trigger centralized deploy
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # MCP shares QUANT_API_IMAGE_TAG. deploy.sh starts those containers
          # everywhere except COMPOSE_HOST_PROFILE=115 (profile stripped there).
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${INFRA_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/blueenergy/quant-infrastructure/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"services\":\"quant-api quant-scheduler quant-mcp-read quant-mcp-actions\",\"tag\":\"${TAG}\"}}"

  notify-dingtalk:
    name: Notify DingTalk on failure
    # 'cancelled' counts too: a run killed mid-build means the image was never
    # published and the deploy never dispatched -- exactly as worth knowing
    # about as a failure, and precisely how the 2026-09-21 ACR stall stayed
    # invisible for 3.5 hours. A job-level timeout kill reports 'cancelled' the
    # same way (2026-10-06: two bump jobs died waiting for the ACR relay).
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs: [test-build, docker, release]
    uses: blueenergy/quant-infrastructure/.github/workflows/notify-dingtalk.yml@main
    secrets:
      DATA_CONTRACT_WEBHOOK_URL: ${{ secrets.DATA_CONTRACT_WEBHOOK_URL }}
      DATA_CONTRACT_WEBHOOK_SECRET: ${{ secrets.DATA_CONTRACT_WEBHOOK_SECRET }}
    with:
      workflow: ${{ github.workflow }}
      needs_json: ${{ toJSON(needs) }}

  docker:
    name: Build & Push Docker image (ghcr.io + ACR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # A registry push has no timeout of its own. On 2026-09-21 a sibling repo
    # lost 3h36m to one that stalled after the build had finished, and a
    # stalled job here blocks release (needs: below) the same way. That stall was
    # the ACR leg, which is back in this job now as a direct push, so the timeout
    # guards both legs. A healthy cold build is ~10 min and a warm one ~2, so 20
    # fails fast without false alarms.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push to ACR from here too, not only over the host relay. The runner sits
      # outside the cross-border link the relay crawls at 50-91 KB/s: it measured
      # ~6 MB/s (2026-10-16, 150 MB probe), so the 185 MB layer that costs the
      # relay 45 minutes takes it ~30 s. The relay stays as the fallback and skips
      # any tag ACR already has.
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/blueenergy/quant-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      # ACR gets the sha- tag only — the same tag set the relay produces, so this
      # adds no new pullable name there. `latest` deliberately stays ghcr-only:
      # docker-compose falls back to `latest` when a *_IMAGE_TAG key is missing
      # from versions.env, and that fallback has to keep failing loudly instead of
      # silently running whatever main built last.
      - name: Extract ACR metadata
        id: meta-acr
        uses: docker/metadata-action@v6
        with:
          images: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-api
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          # arm64 had no consumer: nothing in quant-infrastructure pins a
          # platform, every target is x86_64, and the relay only mirrors amd64.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta-acr.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
