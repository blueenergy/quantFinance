name: CI

on:
  push:
    branches: [ main, master, develop, fix_* ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # required for ghcr.io push

env:
  PIP_CACHE_DIR: ./.cache/pip
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DEFAULT_TIMEOUT: '120'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          pip install pytest
          pytest -q tests/unit -m unit --junitxml=pytest-unit-report.xml
      - name: Run integration tests (skipped)
        run: |
          echo "Skipping integration tests in GitHub Actions."

  deploy:
    name: Deploy to VolcEngine (docker run)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image and save to tar
        run: |
          docker build \
            -t quant-api:deploy \
            -f Dockerfile.backend .
          docker save quant-api:deploy | gzip > quant-api.tar.gz
          docker rmi quant-api:deploy

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VOLC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.VOLC_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer image and deploy
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            quant-api.tar.gz \
            ${{ secrets.VOLC_USER }}@${{ secrets.VOLC_HOST }}:/tmp/quant-api.tar.gz

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.VOLC_USER }}@${{ secrets.VOLC_HOST }} \
            "docker load -i /tmp/quant-api.tar.gz && \
             rm /tmp/quant-api.tar.gz && \
             docker stop quant-api 2>/dev/null || true && \
             docker rm   quant-api 2>/dev/null || true && \
             docker run -d \
               --name quant-api \
               --restart unless-stopped \
               --add-host=host.docker.internal:host-gateway \
               -p 3001:3001 \
               -v /home/deployuser/quantFinance/.env:/app/.env:ro \
               -v /home/deployuser/quantFinance/logs:/app/logs \
               quant-api:deploy && \
             docker image prune -f"

  docker:
    name: Build & Push Docker image (ghcr.io + ACR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/blueenergy/quant-api
            crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
