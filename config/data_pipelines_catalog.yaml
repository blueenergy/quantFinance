# Authoritative list of quant-data-engine ingestion pipelines for monitoring UI.
# job_status_key must match JobStatusRepository job_type strings.
# Scheduling matches quant-data-engine/start.sh + crontab*.txt (see repo).

pipelines:
  - id: stock_daily
    label: 股票日线
    job_status_key: stock_daily
    schedule_hint: "Supercronic 工作日 17:30 → /app/daily_market_sync.sh stock（full 用 crontab.txt，domestic 用 crontab_domestic.txt）"
    freshness:
      database: quant_data
      collection: volume_price
      field: trade_date
      field_kind: date_string

  - id: index_daily
    label: 指数日线
    job_status_key: index_daily
    schedule_hint: "Supercronic 工作日 17:45 → daily_market_sync.sh index（同上 crontab 文件）"
    freshness:
      database: quant_data
      collection: index_prices
      field: trade_date
      field_kind: date_string

  - id: etf_daily
    label: ETF日线
    job_status_key: etf_daily
    schedule_hint: "Supercronic 工作日 18:00 → daily_market_sync.sh etf（同上）"
    freshness:
      database: quant_data
      collection: etf_daily
      field: trade_date
      field_kind: date_string

  - id: financial_sync
    label: 财务数据
    job_status_key: financial_sync
    schedule_hint: "Supercronic 工作日 18:15 → daily_market_sync.sh financial（同上）"
    freshness:
      database: quant_data
      collection: financial_indicator
      field: end_date
      field_kind: date_string

  - id: moneyflow
    label: 资金流向
    job_status_key: moneyflow
    schedule_hint: "Supercronic 工作日 18:30 → daily_market_sync.sh moneyflow（同上）"
    freshness:
      database: quant_data
      collection: money_flow
      field: trade_date
      field_kind: date_string

  - id: ladder_sync
    label: 连板天梯
    job_status_key: ladder_sync
    schedule_hint: "start.sh：DEPLOY_MODE=domestic 或 full 时常驻 run_ladder_sync --loop（LADDER_SYNC_INTERVAL，默认 60s）；不在 crontab 中"
    freshness:
      database: quant_data
      collection: limit_up_ladder
      field: date
      field_kind: date_string

  - id: industry_sync
    label: 行业与ETF聚合
    job_status_key: industry_sync
    schedule_hint: "start.sh：DEPLOY_MODE=domestic 或 full 时常驻 run_industry_sync --loop（INDUSTRY_SYNC_INTERVAL，默认 3600s）；盘后 15:30+ 才跑同步；不在 crontab 中"
    freshness:
      database: quant_data
      collection: market_industry_quotes_daily
      field: date
      field_kind: date_string

  - id: market_sentiment
    label: 市场情绪阴阳谱
    job_status_key: market_sentiment
    schedule_hint: "Supercronic 工作日 18:45 → daily_market_sync.sh sentiment（同上 crontab）"
    freshness:
      database: quant_data
      collection: market_spectrum
      field: trade_date
      field_kind: date_string

  - id: hot_stock_sync
    label: 热股同步
    job_status_key: hot_stock_sync
    schedule_hint: "仅 full：Supercronic crontab.txt 工作日 22:35 → daily_market_sync.sh hotstock；domestic 的 crontab_domestic.txt 当前未包含此项"
    freshness:
      database: quant_data
      collection: hot_stock_raw
      field: trade_date
      field_kind: date_string

  - id: international_news
    label: 国际新闻缓存
    job_status_key: international_news
    schedule_hint: "start.sh：DEPLOY_MODE=overseas 或 full 时常驻 run_international_news_sync --loop（INTL_NEWS_SYNC_INTERVAL，默认 1800s）；可选 SECONDARY_MONGO_URI → --sync-uri；domestic 不启动"
    freshness:
      database: finance
      collection: international_news_cache
      field: fetched_at
      field_kind: datetime
      document_id: "latest"
