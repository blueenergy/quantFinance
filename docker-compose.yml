services:
  # 后端API服务
  quant-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quant-api
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_URL=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - DB_NAME=${MONGO_DB}
      - ANALYZER_DB_NAME=${ANALYZER_DB_NAME:-quant_analyzer}
      - REALTIME_DB_NAME=${REALTIME_DB_NAME:-quant_realtime}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REMOTE_WORKER_API=${REMOTE_WORKER_API:-http://quant-strategy-manager:5000/api/workers}
      - TZ=Asia/Shanghai
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - FROM_NAME=${FROM_NAME:-悟空量化}
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - USE_HTTPS=${USE_HTTPS:-false}
      # Hermes BFF (ChatPanel when VITE_ASSISTANT_STREAM_BACKEND=hermes)
      - HERMES_OPENAI_BASE_URL=${HERMES_OPENAI_BASE_URL:-http://hermes:8642}
      - HERMES_API_SERVER_KEY=${HERMES_API_SERVER_KEY:-dev-hermes-api-key-change-me}
      - HERMES_OPENAI_MODEL=${HERMES_OPENAI_MODEL:-hermes-agent}
      - HERMES_CHAT_TEMPERATURE=${HERMES_CHAT_TEMPERATURE:-0.7}
      # Hermes -> quant-api internal tools (连板天梯等); must match hermes service
      - HERMES_QUANT_INTERNAL_KEY=${HERMES_QUANT_INTERNAL_KEY:-}
      - ENABLE_EMBEDDED_SCHEDULER=false
      - API_WORKERS=${API_WORKERS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quant-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 独立 APScheduler runner（单副本，不对外暴露端口）
  quant-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quant-scheduler
    command: [ "python", "scheduler_runner.py" ]
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_URL=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - DB_NAME=${MONGO_DB}
      - ANALYZER_DB_NAME=${ANALYZER_DB_NAME:-quant_analyzer}
      - REALTIME_DB_NAME=${REALTIME_DB_NAME:-quant_realtime}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TZ=Asia/Shanghai
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - FROM_NAME=${FROM_NAME:-悟空量化}
      - SCHEDULER_LOCK_TTL_SECONDS=${SCHEDULER_LOCK_TTL_SECONDS:-90}
      - SCHEDULER_HEARTBEAT_INTERVAL_SECONDS=${SCHEDULER_HEARTBEAT_INTERVAL_SECONDS:-15}
      - SCHEDULER_RELOAD_INTERVAL_SECONDS=${SCHEDULER_RELOAD_INTERVAL_SECONDS:-15}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quant-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "tools/check_scheduler_health.py" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Analysis workers — scale with: docker compose up --scale quant-analyzer=N
  # No container_name: required for --scale to work.
  # WORKER_ID defaults to the container hostname (unique per replica).
  quant-analyzer:
    build:
      context: ../quantAnalyzer
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_URL=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - DB_NAME=${MONGO_DB}
      - ANALYZER_DB_NAME=${ANALYZER_DB_NAME:-quant_analyzer}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - QWEN_BASE_URL=${QWEN_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-qwen}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen-plus}
      # ETF 分析是否传 response_format=json_object：on=与生产强制一致，auto=按模型名推断，off=关闭
      - ETF_ANALYSIS_RESPONSE_FORMAT=${ETF_ANALYSIS_RESPONSE_FORMAT:-auto}
      - LIMIT_UP_ATTRIBUTION_MODE=${LIMIT_UP_ATTRIBUTION_MODE:-legacy_daily}
      - LIMIT_UP_TRIGGER_MODE=${LIMIT_UP_TRIGGER_MODE:-scheduled}
      - ANALYSIS_INTERVAL=300
      - DISABLE_AUTO_ANALYSIS=${DISABLE_AUTO_ANALYSIS:-false}
      - WORKER_ID=${HOSTNAME}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # networks:
    #   - quant-network
    volumes:
      # Each replica writes to logs/analyzer-<WORKER_ID>.log, so multiple
      # replicas on the same host each get their own file — no conflicts.
      - ../quantAnalyzer/logs:/app/logs
      - ../quant-data-engine/src/quant_data_engine:/app/src/quant_data_engine
      - ../quantAnalyzer/src:/app/src
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 数据同步引擎 (每日定时任务)
  quant-data-engine:
    build:
      context: ../quant-data-engine
      dockerfile: Dockerfile
    container_name: quant-data-engine
    environment:
      # Use same DB as API
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_URL=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - DB_NAME=${MONGO_DB}
      - REALTIME_DB_NAME=${REALTIME_DB_NAME:-quant_realtime}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - RATE_LIMIT_PER_SEC=${RATE_LIMIT_PER_SEC:-20}
      # X API v2：大 V 推文；常驻循环需 ENABLE_X_INFLUENCER_SYNC=1（默认关闭免刷失败日志）
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN:-}
      - ENABLE_X_INFLUENCER_SYNC=${ENABLE_X_INFLUENCER_SYNC:-0}
      - X_INFLUENCER_SYNC_INTERVAL=${X_INFLUENCER_SYNC_INTERVAL:-180}
      - TZ=Asia/Shanghai
      # domestic = Tushare同步+梯子（云服务器）
      # overseas = Yahoo Finance+BBC/CNBC新闻（本地有代理）
      # full     = 全部服务（默认，兼容原有部署）
      - DEPLOY_MODE=${DEPLOY_MODE:-full}
      - SECONDARY_MONGO_URI=${SECONDARY_MONGO_URI:-}
      - SECONDARY_MONGO_DB=${SECONDARY_MONGO_DB:-finance}
      # Trigger quant-api to generate intraday T+0 signals after realtime daily K sync.
      # quant-data-engine uses host networking, so call the host-published API port.
      - INTRADAY_T0_TRIGGER_URL=${INTRADAY_T0_TRIGGER_URL:-http://127.0.0.1:3001/api/intraday-t0/signals/generate-all}
      - INTRADAY_T0_TRIGGER_KEY=${INTRADAY_T0_TRIGGER_KEY:-${HERMES_QUANT_INTERNAL_KEY:-}}
      # Trigger market insight event generation after realtime sector strength is materialized.
      - MARKET_INSIGHT_TRIGGER_URL=${MARKET_INSIGHT_TRIGGER_URL:-http://127.0.0.1:3001/api/market-insights/generate-internal}
      - MARKET_INSIGHT_TRIGGER_KEY=${MARKET_INSIGHT_TRIGGER_KEY:-${HERMES_QUANT_INTERNAL_KEY:-}}
      - DATA_PIPELINES_CATALOG=/app/config/data_pipelines_catalog.yaml
      # Optional per-task cron overrides for daily_market_sync.sh jobs
      - CRON_STOCK_DAILY=${CRON_STOCK_DAILY:-}
      - CRON_INDEX_DAILY=${CRON_INDEX_DAILY:-}
      - CRON_ETF_DAILY=${CRON_ETF_DAILY:-}
      - CRON_FINANCIAL_DAILY=${CRON_FINANCIAL_DAILY:-}
      - CRON_MONEYFLOW_DAILY=${CRON_MONEYFLOW_DAILY:-}
      - CRON_SENTIMENT_DAILY=${CRON_SENTIMENT_DAILY:-}
      - CRON_HOTSTOCK_DAILY=${CRON_HOTSTOCK_DAILY:-}
      # Weekly fund holdings (Tushare fund_portfolio); default Sun 19:00 in crontab
      - CRON_FUND_PORTFOLIO=${CRON_FUND_PORTFOLIO:-}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../quant-data-engine/logs:/app/logs
      - ../quant-data-engine/src/quant_data_engine:/app/src/quant_data_engine
      - ./config/data_pipelines_catalog.yaml:/app/config/data_pipelines_catalog.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 量化小助手 (自然语言交互接口)
  quant-assistant:
    build:
      context: ../quant-assistant
      dockerfile: Dockerfile
    container_name: quant-assistant
    ports:
      - "8002:8002"
    environment:
      # Map QWEN settings from .env -> Assistant OPENAI keys
      - OPENAI_API_KEY=${QWEN_API_KEY:-sk-xxx}
      - OPENAI_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - OPENAI_MODEL=${DEFAULT_MODEL:-qwen-plus}
      # Embeddings（模型名/维度以环境为准；Mongo 命中时 base_url 与 chat 同源，见 quant-assistant llm/request_context）
      - EMBEDDINGS_BASE_URL=${EMBEDDINGS_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-text-embedding-v3}
      - EMBEDDINGS_DIMENSIONS=${EMBEDDINGS_DIMENSIONS:-1024}
      # MongoDB for assistant logic
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_DB=assistant
      # users 集合所在库（与 quantAnalyzer / quantFinance 一致），用于解析每用户 LLM 配置
      - USERS_DB_NAME=${MONGO_DB:-finance}
      # Talk to quant-api inside docker network (port 3001)
      - INTERNAL_API_BASE=http://quant-api:3001
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - ASSISTANT_HOST=0.0.0.0
      - ASSISTANT_PORT=8002
      - RELOAD=false
      - TZ=Asia/Shanghai
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quant-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  # 回测 Worker (轮询任务队列并执行回测)
  backtest-worker:
    build:
      context: ..
      dockerfile: backtest-worker/Dockerfile
    container_name: backtest-worker
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_URL=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - DB_NAME=${MONGO_DB}
      - MONGO_DB=${DATA_DB_NAME:-quant_data}
      - API_BASE_URL=${BACKTEST_API_BASE_URL:-http://quant-api:3001/api}
      - API_TOKEN=${BACKTEST_API_TOKEN}
      - WORKER_ID=${BACKTEST_WORKER_ID:-}
      - POLL_INTERVAL=${BACKTEST_POLL_INTERVAL:-5}
      - LOG_LEVEL=INFO
      - ENABLE_SCREENING=${ENABLE_SCREENING:-true}
      - SCREENING_MODE=${SCREENING_MODE:-conservative}
      - SCREENING_STRATEGIES=${SCREENING_STRATEGIES:-}
      - SCREENING_DAYS_BACK=${SCREENING_DAYS_BACK:-}
      - SCREENING_RUN_AT=${SCREENING_RUN_AT:-}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ../backtest-worker/cache:/app/cache
      - ../data-access-lib:/deps/data-access-lib
      - ../quant-strategies:/deps/quant-strategies
    networks:
      - quant-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 股票评分系统 (每日19:00定时评分)
  quant-scorer:
    build:
      context: ../stock-scoring-system
      dockerfile: Dockerfile
    container_name: quant-scorer
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_URL=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_DB=${MONGO_DB}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - MAX_WORKERS=${SCORING_MAX_WORKERS:-6}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ../stock-scoring-system/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Strategy Manager API 服务
  quant-strategy-manager:
    build:
      context: ..
      dockerfile: quant-strategy-manager/Dockerfile
    container_name: quant-strategy-manager
    ports:
      - "5001:5000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_DB=${MONGO_DB}
      - API_PORT=5000
      - USE_NGINX_WEBSOCKET=${USE_NGINX_WEBSOCKET:-true}
      - PUBLIC_HOST=${PUBLIC_HOST}
      - USE_HTTPS=${USE_HTTPS:-false}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - quant-network
    volumes:
      - ../quant-strategy-manager/logs:/app/quant-strategy-manager/logs
      - ../vnpy-live-trading:/app/vnpy-live-trading
      - ../data-access-lib:/app/data-access-lib
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Hermes Agent (Nous Research; 数据目录见 https://hermes-agent.nousresearch.com/docs/user-guide/docker/)
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    ports:
      # 根路径 / 常为 404；OpenAI 兼容接口在 /v1/*，须带 Authorization: Bearer <API_SERVER_KEY>
      - "8642:8642"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import os,urllib.request; k=os.environ[\"API_SERVER_KEY\"]; r=urllib.request.Request(\"http://127.0.0.1:8642/v1/models\", headers={\"Authorization\": \"Bearer \"+k}); urllib.request.urlopen(r, timeout=5).read()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    volumes:
      - ./hermes-data:/opt/data
    environment:
      - TZ=Asia/Shanghai
      # LLM：须非空。主模型路由以 hermes-data/config.yaml 为准；若仍为 openrouter 会与下述 OPENAI_* 冲突并报错，请改为 provider:custom（见 hermes-custom-endpoint.config.example.yaml）
      - OPENAI_API_KEY=${CUSTOM_API_KEY:-${QWEN_API_KEY:-${OPENAI_API_KEY:-}}}
      - OPENAI_BASE_URL=${CUSTOM_BASE_URL:-${QWEN_BASE_URL:-${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}}}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen-plus}
      # MongoDB（与其他服务共享）
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      # 内部 API 访问
      - QUANT_API_URL=http://quant-api:3001
      # Must match quant-api HERMES_QUANT_INTERNAL_KEY for /api/hermes-tools/*
      - HERMES_QUANT_INTERNAL_KEY=${HERMES_QUANT_INTERNAL_KEY:-}
      # 宿主机与其它容器访问网关 OpenAI 兼容 API 时需 0.0.0.0 + 密钥（见 nousresearch 文档 environment-variables）
      - API_SERVER_ENABLED=${HERMES_API_SERVER_ENABLED:-true}
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-dev-hermes-api-key-change-me}
      # 消息面用户白名单：未配置各平台 ALLOWED_USERS 时，true=放行（仅私网/可信环境；公网勿开）
      - GATEWAY_ALLOW_ALL_USERS=${HERMES_GATEWAY_ALLOW_ALL_USERS:-false}
    command: ["gateway", "run"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quant-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Hermes 官方 Web Dashboard（与 gateway 共享 /opt/data）
  # 勿与 gateway 共用 latest：Hub 上 latest 曾不含 dashboard 子命令导致容器反复重启，见
  # https://github.com/NousResearch/hermes-agent/issues/9153 — 此处固定版本；gateway 仍可用 latest。
  # 文档：https://hermes-agent.nousresearch.com/docs/user-guide/docker/
  hermes-dashboard:
    image: nousresearch/hermes-agent:v2026.4.23
    container_name: hermes-dashboard
    restart: unless-stopped
    # 无 --insecure 时多版本仅绑 127.0.0.1，宿主机 port 映射无法连上；仅私网/受信环境用 --insecure
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open", "--insecure"]
    ports:
      - "9119:9119"
    volumes:
      - ./hermes-data:/opt/data
    environment:
      - TZ=Asia/Shanghai
      # 同网络下用服务名访问 gateway 健康检查与状态
      - GATEWAY_HEALTH_URL=http://hermes:8642
      - GATEWAY_HEALTH_TIMEOUT=5
    depends_on:
      hermes:
        condition: service_healthy
    networks:
      - quant-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  # 前端Web服务
  quant-web:
    build:
      context: ../quantFinance-dashboard
      dockerfile: Dockerfile.fast
    container_name: quant-web
    ports:
      - "8088:80"
      - "8443:443"
    restart: unless-stopped
    profiles: [ "frontend" ] # Optional: Only start with --profile frontend
    environment:
      - BACKEND_URL=http://quant-api:3001
      - ASSISTANT_URL=http://quant-assistant:8002
      - WS_WORKER_HOST=quant-strategy-manager
      - SSL_CERT=${SSL_CERT:-}
      - SSL_KEY=${SSL_KEY:-}
    networks:
      - quant-network
    volumes:
      - ./ssl:/etc/nginx/ssl:ro # SSL证书目录
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB数据库 (已移除，使用外部数据库)
  # mongodb:
  #   image: mongo:7.0
  #   # ...

  # Redis缓存 (可选，用于会话管理和缓存)
  # Prometheus监控 (可选)
  quant-prometheus:
    image: prom/prometheus:latest
    container_name: quant-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    profiles: [ "monitoring" ] # Optional: Only start with --profile monitoring
    networks:
      - quant-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Grafana仪表板 (可选)
  quant-grafana:
    image: grafana/grafana:latest
    container_name: quant-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    profiles: [ "monitoring" ] # Optional: Only start with --profile monitoring
    networks:
      - quant-network
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  quant-network:
    driver: bridge

volumes:
  #   mongodb_data:
  #     driver: local
  #   mongodb_config:
  #     driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
