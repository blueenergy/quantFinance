services:
  # 后端API服务
  quant-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quant-api
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_URL=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - DB_NAME=${MONGO_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REMOTE_WORKER_API=${REMOTE_WORKER_API:-http://quant-strategy-manager:5000/api/workers}
      - TZ=Asia/Shanghai

  # Celery 任务队列 (Worker + Beat)
  quant-analyzer:
    build:
      context: ../quantAnalyzer
      dockerfile: Dockerfile
    container_name: quant-analyzer
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_URL=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - DB_NAME=${MONGO_DB}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEFAULT_LLM_PROVIDER=qwen
      - DEFAULT_MODEL=qwen-plus
      - ANALYSIS_INTERVAL=300
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # networks:
    #   - quant-network
    volumes:
      - ../quantAnalyzer/logs:/app/logs
      - ../quant-data-engine/src/quant_data_engine:/app/src/quant_data_engine

  # 数据同步引擎 (每日定时任务)
  quant-data-engine:
    build:
      context: ../quant-data-engine
      dockerfile: Dockerfile
    container_name: quant-data-engine
    environment:
      # Use same DB as API
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_URL=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - DB_NAME=${MONGO_DB}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - TZ=Asia/Shanghai
      # domestic = Tushare同步+梯子（云服务器）
      # overseas = Yahoo Finance+BBC/CNBC新闻（本地有代理）
      # full     = 全部服务（默认，兼容原有部署）
      - DEPLOY_MODE=${DEPLOY_MODE:-full}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ../quant-data-engine/logs:/app/logs
      - ../quant-data-engine/src/quant_data_engine:/app/src/quant_data_engine
    networks:
      - quant-network

  # 回测 Worker (轮询任务队列并执行回测)
  backtest-worker:
    build:
      context: ../backtest-worker
      dockerfile: Dockerfile
    container_name: backtest-worker
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_URL=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - DB_NAME=${MONGO_DB}
      - API_BASE_URL=${BACKTEST_API_BASE_URL:-http://quant-api:3001/api}
      - API_TOKEN=${BACKTEST_API_TOKEN}
      - WORKER_ID=${BACKTEST_WORKER_ID:-}
      - POLL_INTERVAL=${BACKTEST_POLL_INTERVAL:-5}
      - LOG_LEVEL=INFO
      - ENABLE_SCREENING=${ENABLE_SCREENING:-true}
      - SCREENING_MODE=${SCREENING_MODE:-conservative}
      - SCREENING_STRATEGIES=${SCREENING_STRATEGIES:-}
      - SCREENING_DAYS_BACK=${SCREENING_DAYS_BACK:-}
      - SCREENING_RUN_AT=${SCREENING_RUN_AT:-}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ../backtest-worker/cache:/app/cache
      - ../data-access-lib:/deps/data-access-lib
      - ../quant-strategies:/deps/quant-strategies
    networks:
      - quant-network

  # Strategy Manager API 服务
  quant-strategy-manager:
    build:
      context: ..
      dockerfile: quant-strategy-manager/Dockerfile
    container_name: quant-strategy-manager
    ports:
      - "5001:5000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017/}
      - MONGO_DB=${MONGO_DB}
      - API_PORT=5000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ../quant-strategy-manager/logs:/app/quant-strategy-manager/logs
      - ../vnpy-live-trading:/app/vnpy-live-trading
      - ../data-access-lib:/app/data-access-lib

  # 前端Web服务
  web:
    build:
      context: ../quantFinance-dashboard
      dockerfile: Dockerfile.fast
    container_name: quant-web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped
    profiles: [ "frontend" ] # Optional: Only start with --profile frontend
    networks:
      - quant-network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro # SSL证书目录
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB数据库 (已移除，使用外部数据库)
  # mongodb:
  #   image: mongo:7.0
  #   # ...

  # Redis缓存 (可选，用于会话管理和缓存)
  # Prometheus监控 (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: quant-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    profiles: [ "monitoring" ] # Optional: Only start with --profile monitoring
    networks:
      - quant-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana仪表板 (可选)
  grafana:
    image: grafana/grafana:latest
    container_name: quant-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    profiles: [ "monitoring" ] # Optional: Only start with --profile monitoring
    networks:
      - quant-network
    depends_on:
      - prometheus

networks:
  quant-network:
    driver: bridge

volumes:
  #   mongodb_data:
  #     driver: local
  #   mongodb_config:
  #     driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
